name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Netcode harness (150ms RTT, 2% loss)
        run: pnpm --filter @paradox/server harness
        env:
          DURATION: "12"
      - name: Playwright smoke test
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
